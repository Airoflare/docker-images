name: Build images

on:
  schedule:
    - cron: '0 * * * *'   # hourly: build images with a new upstream release
    - cron: '0 4 * * 1'   # weekly (Mon 04:00 UTC): rebuild all without cache; keep equal to WEEKLY_CRON
  push:
    branches: [master]
    paths: ['images/**']  # rebuild the images whose folder changed
  workflow_dispatch:
    inputs:
      image:
        description: 'Only this image (folder name). Empty = all images.'
        type: string
        required: false
      version:
        description: 'Build this upstream version instead of the latest (needs image)'
        type: string
        required: false
      force:
        description: 'Rebuild even if the version is already published'
        type: boolean
        default: false
      skip_moving_tags:
        description: 'Do not move latest/variant tags (for old versions)'
        type: boolean
        default: false

concurrency:
  group: build-images
  cancel-in-progress: false

permissions: {}

env:
  OWNER: airoflare
  WEEKLY_CRON: '0 4 * * 1'

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      manifests: ${{ steps.plan.outputs.manifests }}
      has_builds: ${{ steps.plan.outputs.has_builds }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # lets the "already published?" check see packages that are still private
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find what to build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BEFORE: ${{ github.event.before }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: bash scripts/plan.sh

  build:
    needs: plan
    if: needs.plan.outputs.has_builds == 'true'
    name: ${{ matrix.image }} ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push without a tag; the publish job joins the arch digests and tags them
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/${{ matrix.image }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: ${{ matrix.no_cache }}
          build-args: ${{ matrix.build_args }}
          outputs: type=image,name=ghcr.io/${{ env.OWNER }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.image }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, build]
    # publish the variants that built, even if another image failed
    if: ${{ !cancelled() && needs.plan.outputs.has_builds == 'true' }}
    name: publish ${{ matrix.image }} ${{ matrix.variant }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless cosign signing (Fulcio/Rekor via GitHub OIDC)
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.manifests) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.image }}-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create multi-arch image and tags
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
          IS_DEFAULT: ${{ matrix.is_default }}
          ARCHS: ${{ matrix.archs }}
          DATE: ${{ needs.plan.outputs.date }}
          SKIP_MOVING_TAGS: ${{ inputs.skip_moving_tags }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: bash scripts/publish.sh

  # Rescan as soon as something was rebuilt, so the README CVE counts drop
  # immediately. Without this, a fix waits for the weekly scan and the tables
  # keep counting already-fixed CVEs until then.
  scan:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.outputs.has_builds == 'true' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: write   # dispatch the scan workflow
    steps:
      - name: Trigger the image scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run security.yml --repo "$REPO" --ref "$GITHUB_REF_NAME"
